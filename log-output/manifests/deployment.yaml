apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: pingpong-counter
          persistentVolumeClaim:
            claimName: pingpong-claim
      containers:
        - name: log-output
          image: sashausoskin/log-output:v5
          volumeMounts:
            - name: pingpong-counter
              mountPath: /usr/src/app/pingpong