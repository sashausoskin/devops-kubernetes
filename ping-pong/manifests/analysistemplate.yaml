apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ping-pong-cpu-rate
  namespace: exercises
spec:
  metrics:
  - name: ping-pong-cpu-rate
    initialDelay: 5m
    successCondition: result < 0.2
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
        query: |
          scalar(sum(rate(container_cpu_user_seconds_total{namespace="exercises"}[5m])))