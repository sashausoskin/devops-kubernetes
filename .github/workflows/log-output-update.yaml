name: Build and publish log output application

permissions:
    contents: write
on:
  push:
    paths: ["log-output/**"]

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend
        run: |-
          docker build --tag "sashausoskin/log-output:$GITHUB_SHA" ./log-output
          docker push "sashausoskin/log-output:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: log-output
        run: kustomize edit set image PROJECT/IMAGE=sashausoskin/log-output:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: './log-output/kustomization.yaml'
          pull: '--rebase --autostash'
          message: New version released ${{ github.sha }}