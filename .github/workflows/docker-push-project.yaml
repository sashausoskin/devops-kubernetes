name: Build and publish application

permissions:
    contents: write

on:
  push:

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ["todo-backend", "todo-app", "image-service"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build --tag "sashausoskin/${{ matrix.app }}:$GITHUB_SHA" ./${{matrix.app}}
          docker push "sashausoskin/${{ matrix.app }}:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right image
        working-directory: ${{ matrix.app }}
        run: kustomize edit set image IMAGE_VER=sashausoskin/${{matrix.app}}:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: './${{ matrix.app }}/kustomization.yaml'
          pull: '--rebase --autostash'
          message: '${{matrix.app}}: New version released ${{ github.sha }}'